# Configuración Nginx para vehiculo_iot_api en EC2
# Proporciona terminación TLS (HTTPS) y soporte de WebSocket seguro (WSS)

# Mapeo estándar para soporte de WebSocket en Nginx
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Redirección de HTTP a HTTPS
server {
    listen 80;
    server_name _;

    # Permitir validación de certificados de Let's Encrypt / Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Servidor seguro HTTPS y WSS
server {
    listen 443 ssl http2;
    server_name _;

    # Rutas de certificados generados por certbot (ajustar con tu dominio real)
    # Ejemplo: certbot --nginx -d tu-dominio.duckdns.org
    ssl_certificate /etc/letsencrypt/live/tu-dominio/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tu-dominio/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 10M;

    # Endpoints REST y documentación Swagger / OpenAPI
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Canal WebSocket seguro (WSS) para vehículos IoT
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts de 24 horas para mantener la conexión WSS persistente
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
